name: ios

# Builds the iPhone / iPad app. Every change is compile-checked; on main, once the App Store Connect key is in the
# repo's secrets, the build is signed and uploaded to TestFlight. The build number is this workflow's run number.
#
# Secrets (Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID   your 10-character team ID (developer.apple.com › Account › Membership details)
#   ASC_KEY_ID      the App Store Connect API key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the keys list
#   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Compile check
        run: |
          xcodebuild build -project ForesiteMind.xcodeproj -scheme ForesiteMind -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

      - name: Sign and upload to TestFlight
        if: github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive -project ForesiteMind.xcodeproj -scheme ForesiteMind -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Mind.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" -quiet

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Mind.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight once Apple finishes processing (usually 5–20 minutes)."

      - name: Upload skipped
        if: github.event_name != 'pull_request' && env.HAS_KEYS != 'true'
        run: echo "::notice::Compiled fine. Add the four App Store Connect secrets listed at the top of ios.yml to upload to TestFlight."
